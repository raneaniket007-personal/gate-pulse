services:
  nginx:
    image: nginx:alpine
    container_name: gate-pulse-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

  web:
    image: gate-pulse-web:demo-v1
    container_name: gate-pulse-web

  api:
    image: gate-pulse-api:demo-v1
    container_name: gate-pulse-api
    env_file:
      - ./apps/api/.env
